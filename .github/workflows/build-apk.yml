name: Build APK Matanime

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Supaya bisa dijalankan manual lewat tombol

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kode repo matanime
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK 17 (untuk kompilasi Android)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Install dependency dan build website
      - name: Install & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      # 5. Pasang Capacitor dan ubah web jadi Android
      - name: Convert to Android with Capacitor
        run: |
          # Deteksi folder hasil build (biasanya dist atau build)
          if [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "build" ]; then
            WEB_DIR="build"
          else
            WEB_DIR="."
          fi
          echo "Target Web Dir: $WEB_DIR"

          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Matanime" "com.mattz.matanime" --web-dir "$WEB_DIR"
          npx cap add android
          npx cap sync android

      # 6. Build file APK Android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 7. Upload APK agar bisa didownload
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matanime-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
